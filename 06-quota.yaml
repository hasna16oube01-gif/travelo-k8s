apiVersion: v1
kind: ResourceQuota
metadata:
  name: travelo-quota
  namespace: travelo
spec:
  hard:
    pods: "12"
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 8Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: travelo-limits
  namespace: travelo
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 768Mi
      max:
        cpu: "1"
        memory: 1Gi
    - type: Pod
      max:
        cpu: "1"
        memory: 1Gi
