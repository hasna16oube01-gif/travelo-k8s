apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-reader
  namespace: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-reader-role
  namespace: travelo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-reader-binding
  namespace: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-reader
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-reader-role
  apiGroup: rbac.authorization.k8s.io
